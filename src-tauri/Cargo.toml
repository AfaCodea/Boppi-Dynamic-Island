[package]
name = "dynamic-island"
version = "0.1.0"
description = "Boppi - A little bop above your apps"
authors = ["you"]
edition = "2021"

[lib]
name = "dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSArray", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSResponder", "NSScreen", "NSColor", "NSGraphicsContext", "NSView"] }
